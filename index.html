<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Study</title>
  <style>
    :root {
      --bg: #000;
      --surface: #111;
      --surface-hover: #181818;
      --line: #262626;
      --text: #f5f5f5;
      --muted: #8a8a8a;
      --accent: #c8ff3d;
      --gutter: clamp(20px, 5vw, 64px);
    }

    * { box-sizing: border-box; margin: 0; }

    html { color-scheme: dark; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", "Segoe UI", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding: clamp(32px, 8vw, 96px) var(--gutter);
      display: flex;
      flex-direction: column;
      gap: clamp(64px, 12vw, 160px);
      max-width: 1280px;
      margin: 0 auto;
    }

    /* 히어로: 가장 크게, 가장 많은 여백 */
    .hero {
      display: flex;
      flex-direction: column;
      gap: clamp(20px, 3vw, 36px);
      padding-top: clamp(24px, 8vw, 96px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    h1 {
      font-size: clamp(3rem, 12vw, 9rem);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.045em;
      word-break: keep-all;
      text-wrap: balance;
    }
    h1 span { color: var(--accent); }

    .lead {
      max-width: 34ch;
      font-size: clamp(1.0625rem, 2.2vw, 1.375rem);
      color: var(--muted);
      word-break: keep-all;
    }

    /* 카드: 눌리고 떠오르는 물리적 인터랙션 */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(12px, 2vw, 20px);
      perspective: 1000px;
    }

    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 56px;
      min-height: 260px;
      padding: clamp(24px, 3vw, 32px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px;
      color: inherit;
      text-decoration: none;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
        background 0.3s, border-color 0.3s, box-shadow 0.45s;
    }
    .card:hover,
    .card:focus-visible {
      transform: translateY(-10px) rotateX(4deg) rotateY(-3deg) scale(1.02);
      background: var(--surface-hover);
      border-color: #3a3a3a;
      box-shadow: 0 30px 60px -20px rgba(200, 255, 61, 0.18),
        0 12px 24px -12px rgba(0, 0, 0, 0.9);
    }
    .card:active {
      transform: translateY(2px) scale(0.97);
      transition-duration: 0.12s;
    }
    .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    .card .num {
      font-size: 0.875rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .card h2 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .card p {
      font-size: 1rem;
      color: var(--muted);
      word-break: keep-all;
    }

    /* 첫 카드는 강조 */
    .card.primary { background: var(--accent); border-color: var(--accent); color: #000; }
    .card.primary:hover { background: #d6ff66; }
    .card.primary .num,
    .card.primary p { color: rgba(0, 0, 0, 0.62); }

    @media (min-width: 900px) {
      .card.primary { grid-column: span 2; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover, .card:focus-visible, .card:active { transform: none; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <span class="eyebrow">GitHub Study</span>
    <h1>GitHub <span>세 번째</span> 버전</h1>
    <p class="lead">GitHub Push &amp; Pull 실습을 재진행합니다.</p>
  </header>

  <main class="cards">
    <a class="card primary" href="#" tabindex="0">
      <span class="num">01</span>
      <div>
        <h2>Push</h2>
        <p>내 컴퓨터에서 수정한 내용을 GitHub 저장소로 올립니다.</p>
      </div>
    </a>
    <a class="card" href="#" tabindex="0">
      <span class="num">02</span>
      <div>
        <h2>Pull</h2>
        <p>GitHub의 최신 변경 사항을 내 컴퓨터로 가져옵니다.</p>
      </div>
    </a>
    <a class="card" href="#" tabindex="0">
      <span class="num">03</span>
      <div>
        <h2>실습</h2>
        <p>수정, 커밋, 동기화를 반복하며 흐름을 익힙니다.</p>
      </div>
    </a>
  </main>
</body>
</html>
